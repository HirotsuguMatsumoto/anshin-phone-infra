name: anshin-phone-production

# Management deployment does not start a carrier or expose SIP/RTP.
services:
  postgres:
    extends:
      file: compose.management.yaml
      service: postgres
    image: postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
  backend:
    extends:
      file: compose.management.yaml
      service: backend
    build: !reset null
    image: ${ANSHIN_PHONE_BACKEND_IMAGE:?set the fixed digest-pinned backend image}
    platform: linux/amd64
    environment:
      ANSHIN_PHONE_ENVIRONMENT: production
      ANSHIN_PHONE_TELEPHONY_ENABLED: "false"
      ANSHIN_PHONE_SIP_SERVER: ""
      ANSHIN_PHONE_FAX_RETENTION_POLICY: cloco_previous_month
      ANSHIN_PHONE_FAX_RETENTION_SECONDS: ""
  backend-migrate:
    extends:
      file: compose.management.yaml
      service: backend-migrate
    build: !reset null
    image: ${ANSHIN_PHONE_BACKEND_IMAGE:?set the fixed digest-pinned backend image}
    platform: linux/amd64
    environment:
      ANSHIN_PHONE_ENVIRONMENT: production
      ANSHIN_PHONE_TELEPHONY_ENABLED: "false"
      ANSHIN_PHONE_FAX_RETENTION_POLICY: cloco_previous_month

  backend-retention:
    extends:
      service: backend
    profiles: [maintenance]
    restart: "no"
    user: "10001:10001"
    entrypoint: [python, -m, app.core.fax_retention]
    command: []
    ports: !reset []
    depends_on: !reset {}
    cap_add: !reset []
    networks: !override [phone-data]
    healthcheck:
      disable: true

secrets:
  postgres_password:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/postgres_password
  smartphone_sip_password:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/smartphone_sip_password
  fax_storage_key:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/fax_storage_key
  internal_api_token:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/internal_api_token

volumes:
  postgres-data:
  fax-protected-storage:

networks:
  phone-data:
    driver: bridge
    internal: true
  phone-auth-egress:
    driver: bridge
