name: anshin-phone-phase1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    extends:
      file: compose.management.yaml
      service: postgres

  backend:
    extends:
      file: compose.management.yaml
      service: backend
    environment:
      ANSHIN_PHONE_SIP_SERVER: ${PUBLIC_SIP_IP}:5060

  backend-migrate:
    extends:
      file: compose.management.yaml
      service: backend-migrate

  pbx-event-forwarder:
    build:
      context: ./deploy/pbx-event-forwarder
    restart: unless-stopped
    environment:
      PBX_EVENT_SPOOL_DIR: /var/spool/anshin-phone/events
      PBX_EVENT_BACKEND_URL: http://backend:8000
      PBX_EVENT_TOKEN_FILE: /run/secrets/internal_api_token
      PBX_EVENT_MAX_PENDING_AGE_SECONDS: "300"
    secrets:
      - internal_api_token
    depends_on:
      backend:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    volumes:
      - pbx-event-spool:/var/spool/anshin-phone/events
      - fax-spool:/var/spool/anshin-phone/fax
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [phone-data]

  rtpengine:
    build:
      context: ./deploy/rtpengine
      args:
        RTPENGINE_VERSION: "10.5.3.5-1+deb12u1"
    restart: unless-stopped
    environment:
      RTPENGINE_INTERNAL_IP: 172.31.251.50
      RTPENGINE_EXTERNAL_IP: 172.31.250.50
      PUBLIC_RTP_IP: ${PUBLIC_RTP_IP:?set VPS public RTP IP}
    ports:
      - "${RTP_BIND_ADDRESS:-0.0.0.0}:20000-20100:20000-20100/udp"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      sip-edge:
        ipv4_address: 172.31.250.50
      pbx-internal:
        ipv4_address: 172.31.251.50

  kamailio:
    build:
      context: ./deploy/kamailio
      args:
        KAMAILIO_VERSION: "5.6.3-2"
    restart: unless-stopped
    environment:
      SBC_ADVERTISED_IP: ${PUBLIC_SIP_IP:?set VPS public SIP IP}
      SBC_EDGE_IP: 172.31.250.40
      SBC_INTERNAL_IP: 172.31.251.40
      ASTERISK_HOST: asterisk
      ASTERISK_PORT: "5060"
      ASTERISK_SOURCE_CIDRS: 172.31.251.20/32
      CARRIER_SOURCE_CIDRS: ${CARRIER_SOURCE_CIDRS:?set comma-separated carrier source addresses}
      SMARTPHONE_SOURCE_CIDRS: ${SMARTPHONE_SOURCE_CIDRS:?set VPN or fixed smartphone source addresses}
      RTPENGINE_SOCKET: udp:rtpengine:2223
    depends_on:
      rtpengine:
        condition: service_healthy
    ports:
      - "${SIP_BIND_ADDRESS:-0.0.0.0}:5060:5060/udp"
    healthcheck:
      test: ["CMD", "kamcmd", "-s", "unix:/tmp/kamailio_ctl", "core.uptime"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      sip-edge:
        ipv4_address: 172.31.250.40
      pbx-internal:
        ipv4_address: 172.31.251.40

  asterisk:
    build:
      context: ./deploy/asterisk
      args:
        ASTERISK_VERSION: "22.10.1"
        ASTERISK_SHA256: "0953564c44fa49827f3c9d70ca6e80db83828c9848440852c6be44c961855353"
        ASTERISK_BUILD_JOBS: "1"
    restart: unless-stopped
    environment:
      CARRIER_AUTH_MODE: ${CARRIER_AUTH_MODE:?set registration or ip}
      CARRIER_HOST: ${CARRIER_HOST:?set carrier SIP host}
      CARRIER_PORT: ${CARRIER_PORT:-5060}
      CARRIER_QUALIFY_FREQUENCY: ${CARRIER_QUALIFY_FREQUENCY:-30}
      CARRIER_SOURCE_CIDRS: ${CARRIER_SOURCE_CIDRS:?set carrier source addresses}
      CARRIER_SIGNALING_ADDRESS: ${CARRIER_SIGNALING_ADDRESS:?set actual PBX carrier signaling address}
      CARRIER_MEDIA_ADDRESS: ${CARRIER_MEDIA_ADDRESS:?set actual PBX carrier media address}
      CARRIER_SIP_USERNAME: ${CARRIER_SIP_USERNAME:?set carrier SIP username}
      PBX_DEVICE_IP: 172.31.251.20
      PBX_CARRIER_IP: 172.31.250.20
      SBC_HOST: kamailio
      SBC_PORT: "5060"
      TEL_DID: ${TEL_DID:?set carrier-issued TEL DID in digits}
      FAX_MEDIA_MODE: ${FAX_MEDIA_MODE:-audio}
      FAX_DID: ${FAX_DID:?set carrier-issued FAX DID in digits}
      SMARTPHONE_EXTENSION: ${SMARTPHONE_EXTENSION:-2001}
      SMARTPHONE_QUALIFY_FREQUENCY: ${SMARTPHONE_QUALIFY_FREQUENCY:-30}
      ANSHIN_PHONE_TENANT_ID: ${ANSHIN_PHONE_TENANT_ID:-anshin-phase1}
      PBX_EVENT_SPOOL_DIR: /var/spool/asterisk/anshin-events
      PBX_EVENT_BACKEND_URL: http://backend:8000
      PBX_EVENT_TOKEN_FILE: /run/secrets/internal_api_token
      CARRIER_SIP_PASSWORD_FILE: /run/secrets/carrier_sip_password
      SMARTPHONE_SIP_PASSWORD_FILE: /run/secrets/smartphone_sip_password
    secrets:
      - carrier_sip_password
      - smartphone_sip_password
      - internal_api_token
    depends_on:
      backend:
        condition: service_healthy
      kamailio:
        condition: service_healthy
    volumes:
      - asterisk-state:/var/lib/asterisk
      - asterisk-logs:/var/log/asterisk
      - fax-spool:/var/spool/asterisk/fax
      - pbx-event-spool:/var/spool/asterisk/anshin-events
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 10s
      timeout: 5s
      retries: 6
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      phone-data:
      sip-edge:
        ipv4_address: 172.31.250.20
      pbx-internal:
        ipv4_address: 172.31.251.20

secrets:
  postgres_password:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/postgres_password
  carrier_sip_password:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/carrier_sip_password
  smartphone_sip_password:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/smartphone_sip_password
  fax_storage_key:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/fax_storage_key
  internal_api_token:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/internal_api_token

volumes:
  postgres-data:
  asterisk-state:
  asterisk-logs:
  fax-protected-storage:
  fax-spool:
  pbx-event-spool:

networks:
  phone-auth-egress:
    driver: bridge
  phone-data:
    driver: bridge
    internal: true
  sip-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24
  pbx-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.251.0/24
