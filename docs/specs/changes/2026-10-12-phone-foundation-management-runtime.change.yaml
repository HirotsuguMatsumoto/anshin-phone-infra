invariants:
- 同じinstruction originがwrite planeと完了判定を所有する
- 実番号・実carrier・本番を接続しない
- 同じtenantのactive endpointと有効割当だけで新規通話を許可する
- 端末資格は端末ごとに異なり卸トランク資格を配布しない
- 原本と宛先を保護し通常管理一覧へ参照又は平文を返さない
- 結果のownerをcalled channel一つにして二重完了で成功を失わない
- 最後のconsumer完了までproducer runtimeと原本を維持する
- 助成対象4機能及び独自trust・release gateを追加しない
- 2026-10-12のschema補完は保存済み正式plan/resultのbase_revision・pathsとGit blobから行い再実装又は新しいruntime検証成功と扱わない
acceptance_criteria:
- 番号・端末・割当・停止・解除・失効を実APIとPBXで確認する
- 実SIPとG.711 FAXを隔離fixtureで確認し最後のBackend/UI responseを確認する
- tenant・role・重複・再送・通信失敗・期限と再起動時の曖昧状態を区別する
- local DBへmigrationを適用し別DBと別原本directoryへ隔離復元する
- 合成音声・FAX・録音の重なりでlocal資源を観測する
- 同じfixed sourceで既存canonical checkと独立reviewを行う
out_of_scope:
- production release、実回線、契約発注、Store公開
- 不在着信タスク、FAX担当業務状態、Core職員同期、連絡引継ぎ監査
- 実機・APNs・FCM資格を使用する外部試験
