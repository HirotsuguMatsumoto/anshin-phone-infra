risk_level: high
rollback:
  steps:
  - 追加した参照又はPhone読取部分だけを訂正し既存Core/Authの読取とruntimeを維持
  strategy: forward-source-correction
  triggers:
  - resolver参照又は既存observerの契約不整合
rollout:
  steps:
  - 最新mainをpull/rebaseし既存sourceと実機を読取確認
  - 登録・配置文書・既存observerを同期
  - 既存focused/canonicalと独立review後にguarded non-forceでmainへ統合
  - 同じfixed-blob launcherから新sourceの既存read-only operationを実行し準備事実を記録
  strategy: source-and-existing-read-only-preparation
  triggers:
  - Phone本番準備の継続指示
