- 旧UI記録と実装前snapshotを現行仕様又は未実装の現在状態へ読み替えない
- 既存のhost observerはCore/Authの結果契約を保ちPhone準備のread/missing/driver failureを区別する
- NVMe・CPU topology・Phone project/VMの読取は固定driverだけを使い生config・secret・外部資格を出力しない
- focused checkと既存selectorのcanonical checkを同じsourceへ結び必要な独立reviewを行う
