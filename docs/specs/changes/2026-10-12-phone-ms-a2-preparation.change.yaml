invariants:
- instruction originが唯一のwriterとGit統合・完了判定を所有する
- PhoneはMS-A2-2の専用LXD VM内へ予定配置しCore/AuthのVM・DB・volume・credentialを共用しない
- 既存のinspect-core-host-recovery-v1でsecretを含まないPhone資源・配置の事実だけを読み新しいauthority・gate・gateway
  account・鍵を追加しない
- 既存Core/AuthのCPU・RAM・storage、VM状態、業務data及び配備先を変更しない
- 未実測の旧resource候補を現値又は受入済み上限として扱わない
- 文書rootを実際のrepository配置へ同期するがauthority又は製品実装状態を昇格させない
- cloud resource・課金・実carrier・番号・顧客trafficを作成又は接続しない
monitoring:
  observation_period: 今回のPhone本番準備中
  owner: anshin
  signals:
  - resolver unique result
  - sourceと実機resource・Phone配置の差
  - 未確認・未実施と準備結果の区別
out_of_scope:
- Core/Authのresource縮小・restart・Phone VM作成・production deploy
- 新規cloud resource・秘密の外部登録・hardware購入・実回線・顧客開通
- 助成対象四機能・新trust・署名・承認記録基盤・品質gate
owner: anshin-phone-infra
