    anshin-phone-infra:README.md: a0961e483577c1c6bfb02bd7b1b8841f3a1bd427
    anshin-phone-infra:docs/README.md: e6151c33127add34bbbc0f5aa68b435a1fafc115
    anshin-phone-infra:docs/specs/changes/2026-10-12-phone-document-navigation.change.yaml: null
rollout:
  strategy: documents-only-main-integration
  steps:
  - 最新mainをpull --ff-onlyで取得しworktreeをrebaseして既存差分とsourceを確認
  - 対象READMEとリンクだけを同期してcommit
  - clean fixed SHAのdocuments-onlyと必要な独立reviewを実施
  - 最新origin/mainへのrebase後に同一bound inputを確認しguarded non-force pushでmainへ統合
rollback:
  strategy: forward-document-correction
  steps:
  - 誤ったリンク・索引の該当箇所だけを訂正し既存本文と原本を保持
monitoring:
  owner: anshin-corporate-strategy
  signals:
  - Phone資料の追加・移動・版変更時にリンク先と位置付けを同期
  observation_period: 次のPhone資料更新時
approvals: []
