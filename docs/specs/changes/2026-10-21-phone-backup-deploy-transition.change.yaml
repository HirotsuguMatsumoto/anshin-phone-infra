  "invariants": [
    "capture ownerだけが既知BackendのStartedAt変更を許容",
    "container ID/image/RestartCount・他container・volume/backing・profileを維持",
    "同一producer exit0と唯一のcapture stdoutを中継し外部restartを取り込まない",
    "既存operation/lock/結果/receiptと31日保護を再利用し新authority/journal/KMSなし"
  ],
  "acceptance_criteria": [
    "実captureとBackend停止再開を通す既存production fixtureで正常更新を確認",
    "capture後追加restartを実Dockerで拒否、ID/image/RestartCount/別container/volume driftをunit行列へ固定",
    "missing/duplicate/malformed captureは配備前に停止",
    "canonical/fixed SHA独立review/main統合後、backup source更新と中央配備・同世代隔離復旧を実確認",
    "実fixtureは固定qualified中央sourceのscripts/business_file_backup.pyを同interpreterのPYTHONPATHからimportし、起動前に実closureを確認する。ageとS3だけfixture境界とし、欠落依存をruntime障害と誤分類しない。"
  ],
  "out_of_scope": [
    "実carrier",
    "助成4機能",
    "他製品保存先/資格",
    "新SSH/authority/receipt/KMS"
  ],
  "rollout": {
    "strategy": "existing-registered-phone-deploy-owner",
    "steps": [
      "I実fixture/重点/canonical/fixed review/main統合",
      "旧backup preimageを観測し既存backup-installで新sourceへ更新",
      "新I source/treeを中央既存typed inputへ固定して新release実行",
      "配備後S3同世代隔離restore/health/公式管理画面確認"
    ],
    "triggers": [
      "owner依頼の基礎Phone本番化"
    ]
  },
  "rollback": {
    "strategy": "existing-owner-preserve-backup",
    "steps": [
      "既知の変更file/profile/leafだけ元byteへ独立補償",
      "guest lock解放後に元timer状態を復元",
      "unknown consumer/preimageは資格/candidateを保全し標準失敗結果へ記録",
      "S3世代・nonleaf鍵を削除しない"
    ],
    "triggers": [
      "取得/復旧/health失敗"
    ]
  },
  "monitoring": {
    "owner": "anshin-phone-infra",
    "signals": [
      "既存manifest/restore結果",
      "backup/retention timer status",
      "証明書/CRL期限と復旧PDCA"
    ],
    "observation_period": "初回受入と定期運用"
  },
