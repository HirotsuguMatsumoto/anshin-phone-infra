invariants:
- source統合・模擬通信・実機観測・容量受入・本番配備・本人UI確認を区別する
- planはreference/draftとしcanonical・費用・SDK・UI/UX・商用承認へ昇格しない
- 秘密・原本・raw私有証跡・一時pathをGitへコピーしない
- 既存release/gateway/backup ownerとselectorを参照し新gate・authority・receiptを追加しない
- Core/Auth変更・VM作成・新費用・実回線・助成対象四機能を実施しない
acceptance_criteria:
- 総合入口とInfra資料入口から実機観測の限界・本番準備・SDK未検証を参照できる
- SDK公式sourceと未決定のversion/license/費用を区別する
- 文書だけのcanonical検査を最終clean commit後に一回行い高risk独立reviewを行う
out_of_scope:
- runtimeコード変更・配備・route変更・VM作成・資源縮小
- 契約・購入・新resource・store公開・実回線・顧客通信・助成四機能
concurrency:
