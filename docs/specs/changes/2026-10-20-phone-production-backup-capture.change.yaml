    "registered deploy operationでinstall/capture/同世代隔離restore/statusを確認",
    "実取得と復旧合格後に既存timerを有効化/readback"
  ],
  "out_of_scope": [
    "実carrier",
    "助成4機能",
    "他製品保存先/資格",
    "新SSH/authority/receipt/KMS"
  ],
  "rollout": {
    "strategy": "existing-registered-phone-deploy-owner",
