services:
  backend:
    ports: !reset []

  rtpengine:
    ports: !reset []
    environment:
      PUBLIC_RTP_IP: 172.31.250.50

  kamailio:
    ports: !reset []
    environment:
      SBC_ADVERTISED_IP: 172.31.250.40
      CARRIER_SOURCE_CIDRS: 172.31.250.10/32
      SMARTPHONE_SOURCE_CIDRS: 172.31.250.30/32

  asterisk:
    networks:
      pbx-internal:
        ipv4_address: 172.31.251.20

  mock-carrier:
    build:
      context: ./tests/mock-sip
    command: ["tail", "-f", "/dev/null"]
    networks:
      sip-edge:
        ipv4_address: 172.31.250.10

  mock-smartphone:
    build:
      context: ./tests/mock-sip
    command: ["tail", "-f", "/dev/null"]
    networks:
      sip-edge:
        ipv4_address: 172.31.250.30
