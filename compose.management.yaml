name: anshin-phone-phase1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: anshin_phone
      POSTGRES_USER: anshin_phone
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anshin_phone -d anshin_phone"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [phone-data]

  backend:
    build:
      context: ${ANSHIN_PHONE_BACKEND_DIR:-./anshin-phone-backend}
    restart: unless-stopped
    environment:
      ANSHIN_PHONE_ENVIRONMENT: ${ANSHIN_PHONE_ENVIRONMENT:-phase1}
      ANSHIN_PHONE_DB_HOST: postgres
      ANSHIN_PHONE_DB_PORT: "5432"
      ANSHIN_PHONE_DB_NAME: anshin_phone
      ANSHIN_PHONE_DB_USER: anshin_phone
      ANSHIN_PHONE_DB_PASSWORD_FILE: /run/secrets/postgres_password
      ANSHIN_PHONE_INTERNAL_TOKEN_FILE: /run/secrets/internal_api_token
      ANSHIN_PHONE_OIDC_ISSUER: https://auth.anshin.care/realms/anshin
      ANSHIN_PHONE_OIDC_AUDIENCE: anshin-phone
      ANSHIN_PHONE_FAX_STORAGE_KEY_FILE: /run/secrets/fax_storage_key
      ANSHIN_PHONE_SIP_MASTER_SECRET_FILE: /run/secrets/smartphone_sip_password
      ANSHIN_PHONE_SIP_SERVER: ${ANSHIN_PHONE_SIP_SERVER:-}
      ANSHIN_PHONE_TELEPHONY_ENABLED: ${ANSHIN_PHONE_TELEPHONY_ENABLED:-true}
      ANSHIN_PHONE_FAX_RETENTION_SECONDS: ${ANSHIN_PHONE_FAX_RETENTION_SECONDS:-86400}
    secrets:
      - postgres_password
      - internal_api_token
      - smartphone_sip_password
      - fax_storage_key
    volumes:
      - fax-protected-storage:/var/lib/anshin-phone/fax
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ANSHIN_PHONE_BACKEND_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [phone-data, phone-auth-egress]

  backend-migrate:
    build:
      context: ${ANSHIN_PHONE_BACKEND_DIR:-./anshin-phone-backend}
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/anshin-phone/fax && chown 10001:10001 /var/lib/anshin-phone/fax && exec alembic upgrade head"]
    volumes:
      - fax-protected-storage:/var/lib/anshin-phone/fax
    environment:
      ANSHIN_PHONE_ENVIRONMENT: ${ANSHIN_PHONE_ENVIRONMENT:-phase1}
      ANSHIN_PHONE_DB_HOST: postgres
      ANSHIN_PHONE_DB_PORT: "5432"
      ANSHIN_PHONE_DB_NAME: anshin_phone
      ANSHIN_PHONE_DB_USER: anshin_phone
      ANSHIN_PHONE_DB_PASSWORD_FILE: /run/secrets/postgres_password
      ANSHIN_PHONE_INTERNAL_TOKEN_FILE: /run/secrets/internal_api_token
    secrets:
      - postgres_password
      - internal_api_token
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [phone-data]

secrets:
  postgres_password:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/postgres_password
  smartphone_sip_password:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/smartphone_sip_password
  fax_storage_key:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/fax_storage_key
  internal_api_token:
    file: ${ANSHIN_PHONE_SECRET_DIR:?set absolute external secret directory}/internal_api_token

volumes:
  postgres-data:
  fax-protected-storage:

networks:
  phone-data:
    driver: bridge
    internal: true
  phone-auth-egress:
    driver: bridge
